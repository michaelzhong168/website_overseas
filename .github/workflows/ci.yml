name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql://app:app@localhost:5432/website
  JWT_SECRET: ci-jwt-secret-not-for-production
  API_PORT: "4000"
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: website
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d website"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm run db:migrate

      - name: Seed
        run: pnpm run db:seed

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
